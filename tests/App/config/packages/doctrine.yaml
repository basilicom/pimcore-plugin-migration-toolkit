doctrine:
  dbal:
    connections:
      default:
        host: '%env(MYSQL_HOST)%'
        port: '%env(int:MYSQL_PORT)%'
        user: '%env(MYSQL_USER)%'
        password: '%env(MYSQL_PASSWORD)%'
        dbname: '%env(MYSQL_DATABASE)%'
        server_version: 'mariadb-11.8.1'
        mapping_types:
          enum: string
          bit: boolean
