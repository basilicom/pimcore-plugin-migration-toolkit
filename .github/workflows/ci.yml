name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test against Pimcore 12
    runs-on: ubuntu-latest
    env:
      # The checkout belongs to the runner's uid, which www-data cannot write to through the bind mount.
      DOCKER_USER: root
    steps:
      - uses: actions/checkout@v4

      - name: Start the rig and install Pimcore
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Tear down
        if: always()
        run: make destroy
