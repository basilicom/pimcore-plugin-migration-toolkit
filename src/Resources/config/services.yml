services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Basilicom\PimcorePluginMigrationToolkit\Command\:
        resource: '../../Command'
        public: true

    Basilicom\PimcorePluginMigrationToolkit\Translation\:
        resource: '../../Translation'
        exclude:
            - '../../Translation/Exception'
            - '../../Translation/ImportResult.php'
            - '../../Translation/Overwrite.php'
